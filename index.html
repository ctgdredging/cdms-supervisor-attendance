    <script>
      // Defensive guard for environments (like sandboxed iframes) where window.fetch is getter-only.
      // Allows libraries attempting `window.fetch = ...` or `globalThis.fetch = ...` to safely redefine it.
      (function() {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');
          if (desc && !desc.writable && !desc.set) {
            var currentFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              get: function() { return currentFetch; },
              set: function(val) { currentFetch = val; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Continue execution safely
        }

        // Wrap AbortController.prototype.abort to ensure an explicit reason is always supplied
        // and prevent synchronous "AbortError: signal is aborted without reason" exceptions.
        try {
          if (typeof AbortController !== 'undefined' && AbortController.prototype && AbortController.prototype.abort) {
            var origAbort = AbortController.prototype.abort;
            AbortController.prototype.abort = function(reason) {
              try {
                if (reason !== undefined) {
                  return origAbort.call(this, reason);
                } else {
                  return origAbort.call(this, new DOMException('Request was aborted.', 'AbortError'));
                }
              } catch (err) {
                // Benign abort error - suppress to prevent uncaught exceptions in WebChannel/Firestore
                return;
              }
            };
          }
        } catch (e) {
          // Continue execution safely
        }

        // Suppress benign unhandled abort exceptions (e.g. from aborted fetch or Firestore listeners)
        var isBenign = function(val) {
          if (!val) return false;
          var str = (typeof val === 'object' ? (val.message || val.name || val.stack || String(val)) : String(val)).toLowerCase();
          return (
            str.indexOf('signal is aborted') !== -1 ||
            str.indexOf('aborted without reason') !== -1 ||
            str.indexOf('aborterror') !== -1 ||
            str.indexOf('user aborted') !== -1 ||
            str.indexOf('request was aborted') !== -1 ||
            str.indexOf('failed to fetch') !== -1 ||
            str.indexOf('cancelled') !== -1
          );
        };

        var origOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          if (isBenign(message) || isBenign(error)) {
            return true; // suppresses the error
          }
          if (typeof origOnError === 'function') {
            return origOnError.apply(this, arguments);
          }
          return false;
        };

        var origOnUnhandled = window.onunhandledrejection;
        window.onunhandledrejection = function(event) {
          var reason = event && event.reason;
          if (isBenign(reason)) {
            if (event && event.preventDefault) event.preventDefault();
            return true;
          }
          if (typeof origOnUnhandled === 'function') {
            return origOnUnhandled.apply(this, arguments);
          }
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (isBenign(event && event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, { capture: true });

        window.addEventListener('error', function(event) {
          if (isBenign(event && (event.message || event.error))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, { capture: true });
      })();
